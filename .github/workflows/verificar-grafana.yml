name: Verificar Grafana en Kubernetes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evidencias/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Crear clúster kind
        uses: helm/kind-action@v1.15.2
      - name: Desplegar Grafana
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/grafana --timeout=600s
          kubectl get deployment,replicaset,pods,service -o wide | tee evidencias/recursos.txt
          kubectl describe deployment grafana > evidencias/deployment.txt
          test "$(kubectl get deployment grafana -o jsonpath='{.status.readyReplicas}')" = 2
          test "$(kubectl get replicasets -l app=grafana -o jsonpath='{.items[0].status.readyReplicas}')" = 2
      - name: Verificar acceso y capturar Grafana
        run: |
          kubectl port-forward service/grafana 3000:3000 > /tmp/grafana-captura.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/health -o evidencias/salud-http.json && grep -q '"database"' evidencias/salud-http.json; then break; fi
            sleep 2
          done
          if ! grep -q '"database"' evidencias/salud-http.json; then
            cat /tmp/grafana-captura.log
            kubectl get pods -o wide
            kubectl logs deployment/grafana --tail=80
            exit 1
          fi
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/capturar-grafana.cjs
          node scripts/capturar-salida.cjs evidencias/recursos.txt evidencias/01-recursos.png
      - name: Verificar escalado a tres réplicas
        run: |
          kubectl scale deployment/grafana --replicas=3
          kubectl rollout status deployment/grafana --timeout=600s
          kubectl get deployment,replicaset,pods -o wide | tee evidencias/escalado.txt
          test "$(kubectl get deployment grafana -o jsonpath='{.status.readyReplicas}')" = 3
          node scripts/capturar-salida.cjs evidencias/escalado.txt evidencias/03-escalado.png
      - name: Publicar evidencia como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-grafana
          path: evidencias/
          if-no-files-found: warn
      - name: Guardar evidencia en el repositorio
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias/
          git commit -m "Guardar evidencia real de Grafana [skip ci]" || exit 0
          git push
